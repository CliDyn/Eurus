name: Sync to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch all LFS objects
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject HuggingFace metadata into README
        run: |
          HF_HEADER="---
          title: Eurus
          emoji: 🌊
          colorFrom: purple
          colorTo: blue
          sdk: docker
          pinned: false
          ---
          "
          # Remove leading spaces from heredoc indentation
          HF_HEADER=$(echo "$HF_HEADER" | sed 's/^          //')
          echo "$HF_HEADER" | cat - README.md > README_hf.md
          mv README_hf.md README.md

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          import os, time
          api = HfApi()
          token = os.environ['HF_TOKEN']
          ignore = [
              '.git/*', '.github/*',
              'node_modules/*', 'frontend/node_modules/*',
              '__pycache__/*', '*.pyc',
              '.venv/*', '.env',
              'data/*', 'logs/*', '.memory/*',
              '*.egg-info/*',
          ]
          for repo_id in ['CliDyn/Eurus', 'dmpantiu/Eurus']:
              for attempt in range(3):
                  try:
                      print(f'Uploading to {repo_id} (attempt {attempt+1})...')
                      api.upload_folder(
                          folder_path='.',
                          repo_id=repo_id,
                          repo_type='space',
                          token=token,
                          ignore_patterns=ignore,
                      )
                      print(f'Upload to {repo_id} complete')
                      break
                  except Exception as e:
                      print(f'Attempt {attempt+1} failed for {repo_id}: {e}')
                      if attempt < 2:
                          time.sleep(10)
                      else:
                          print(f'WARNING: Skipping {repo_id} after 3 failures')
          print('Sync finished')
          "
